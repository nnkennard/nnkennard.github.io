<div class="card m-1" style="width: 28rem;">
  <img src="{{ project.img | relative_url}}" class="card-img-top" alt="...">
  <div class="card-body">
    <a href="{{ project.url | relative_url }}"><h5 class="card-title">{{ project.title }}</h5></a>
    {{project.year}} · {{project.venue}} <br>
    audience: {{project.audience}}
  </div>
</div>
