---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-8" style="max-width: 700px;">
    {{ content }}
    {% include news.html %}
  </div>
  <div class="col-md-4"style="max-width: 275px;">
    <img class="rounded shadow img-fluid" src='/assets/img/prof_pic.jpg'width="100%">
    <br>
    <br>
     <h1>social media, etc.</h1>
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" target="_blank"> <span class="nobr">{{ item.name }}</span></a>
      {% unless forloop.last %} | {% endunless %}
    {% endfor %}
  </div>
</div>
{% include footer.html %}
